name: story_editor
description: "A new Flutter package project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  matrix_gesture_detector:
    git:
      url: git@github.com:kibutsuji-muzan/matrix_gesture_detector.git
  video_player: ^2.8.2
  flutter_svg: ^2.0.9
  just_audio: ^0.10.5
  path_provider: ^2.1.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # To add assets to your package, add an assets section, like this:
  assets:
    - assets/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Thin.ttf
          weight: 100
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/Inter-Black.ttf
          weight: 900

    - family: AbrilFatface
      fonts:
        - asset: assets/fonts/AbrilFatface/font.ttf

    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue/font.ttf

    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript/font.ttf

    - family: KolkerBrush
      fonts:
        - asset: assets/fonts/KolkerBrush/font.ttf

    - family: ProtestRevolution
      fonts:
        - asset: assets/fonts/ProtestRevolution/font.ttf

    - family: ProtestStrike
      fonts:
        - asset: assets/fonts/ProtestStrike/font.ttf

    - family: RubikDoodleShadow
      fonts:
        - asset: assets/fonts/RubikDoodleShadow/font.ttf

    - family: RubikGlitchPop
      fonts:
        - asset: assets/fonts/RubikGlitchPop/font.ttf
        
    - family: ZenTokyoZoo
      fonts:
        - asset: assets/fonts/ZenTokyoZoo/font.ttf
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
